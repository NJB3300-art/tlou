name: Build TLOU UWP (Xbox Dev Mode)

# Builds the UWP version of this repository (a copy of ravencaio/tlou-remastered-pc, GPL-2.0, with
# the UWP changes):
#   1. gow3-runtime.dll: the runtime, MSYS2 CLANG64, -DGOW3_UWP=ON
#   2. TLOU.Uwp: the packaged app (launcher + host), MSVC / C++/WinRT, with the runtime's DLLs inside
# Every push to main builds and uploads artifacts; a tlou-v* tag or a manual run with a tag also
# publishes a GitHub Release. No game files are involved.

on:
  push:
    branches: [main]
    tags: ['tlou-v*', 'v*-uwp']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. tlou-v0.1.0); empty: build only'
        required: false

permissions:
  contents: write

jobs:
  runtime:
    name: gow3-runtime.dll (MSYS2 CLANG64)
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as committed (the patch has LF)
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: port
          submodules: recursive

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross mingw-w64-clang-x86_64-ntldd

      - name: Apply the FSR-Vulkan patches (as build.sh does)
        run: |
          cd port/gow3_pc
          for patch in gpu/patches/fsr-vulkan/*.patch; do
            git -C gpu/third_party/fsr-vulkan apply "$PWD/$patch"
          done

      - name: Configure
        run: |
          cd port/gow3_pc
          cmake -S gpu -B out/gpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DGOW3_UWP=ON \
            -DGOW3_PGO=off -DGOW3_LTO=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build gow3-runtime.dll
        run: |
          cd port/gow3_pc
          if ! ninja -C out/gpu gow3-runtime > out/build.log 2>&1; then
            grep -E "error|Error|undefined" out/build.log | head -150
            tail -60 out/build.log
            exit 1
          fi
          tail -3 out/build.log

      - name: Collect the DLLs it loads
        run: |
          mkdir -p dist
          cp port/gow3_pc/out/gpu/gow3-runtime.dll dist/
          # Everything from CLANG64 that the DLL needs, recursively; Windows' own DLLs stay out.
          ntldd -R dist/gow3-runtime.dll | tr -d '\r' | awk '{print $1}' | sort -u | while read -r name; do
            if [ -f "/clang64/bin/$name" ]; then cp "/clang64/bin/$name" dist/; fi
          done
          # What every packaged DLL imports from the system: the first thing to check when the
          # console refuses to load one (error 126).
          {
            for dll in dist/*.dll; do
              echo "== $(basename "$dll")"
              llvm-objdump -p "$dll" | grep "DLL Name" | sed 's/.*DLL Name: //' | sort -u
            done
          } > dist/runtime-imports.txt
          cp port/LICENSE dist/LICENSE-tlou-remastered-pc.txt
          ls -la dist
          cat dist/runtime-imports.txt

      - name: Upload the runtime
        uses: actions/upload-artifact@v4
        with:
          name: gow3-runtime
          path: dist/

      - name: Staging kit for the PC
        run: |
          mkdir -p kit/tlou-uwp-stage-kit/gow3_pc
          cd port
          cp -r tools Setup-TLOU-Xbox.cmd Stage-TLOU-Xbox.cmd LICENSE ../kit/tlou-uwp-stage-kit/
          cp -r gow3_pc/scripts ../kit/tlou-uwp-stage-kit/gow3_pc/
          cp uwp-app/README.md ../kit/tlou-uwp-stage-kit/README-UWP.md

      - name: Upload the staging kit
        uses: actions/upload-artifact@v4
        with:
          name: stage-kit
          path: kit/

  dozen:
    name: Mesa Dozen (Vulkan on Direct3D 12)
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      MESA_VERSION: 26.3.0
      MESA_SHA256: 91d729aa68bb89e4ec857841300bbe922bcb3e52b1f97566ca83930d3b28343a
      # mmozeiko/build-mesa: its recipe for Mesa on Windows and its dxil-hash.patch (Mesa signs its own
      # shaders when dxil.dll is missing or refused)
      BUILD_MESA_COMMIT: 68725fb5d8e12c25efbb655780747bda417a53c1
    steps:
      - name: Keep line endings as committed (the patch has LF)
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: self

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools (meson, ninja, mako, win_flex_bison)
        shell: cmd
        run: |
          pip install meson ninja mako pyyaml packaging || exit /b 1
          mkdir winflexbison && cd winflexbison
          curl -sfL -o wfb.zip https://github.com/lexxmark/winflexbison/releases/download/v2.5.24/win_flex_bison-2.5.24.zip || exit /b 1
          tar -xf wfb.zip || exit /b 1
          echo %CD%>> %GITHUB_PATH%

      - name: Mesa source and patches
        shell: pwsh
        run: |
          Write-Host "Downloading Mesa $env:MESA_VERSION"
          curl.exe -fL --retry 4 --retry-delay 10 --connect-timeout 30 --max-time 900 -o mesa.tar.xz "https://archive.mesa3d.org/mesa-$env:MESA_VERSION.tar.xz"
          if ($LASTEXITCODE -ne 0) { Write-Error "Mesa download failed"; exit 1 }
          $hash = (Get-FileHash mesa.tar.xz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MESA_SHA256) { Write-Error "mesa.tar.xz: sha256 $hash"; exit 1 }
          Write-Host "Extracting (7-Zip)"
          & "C:\Program Files\7-Zip\7z.exe" x mesa.tar.xz -y -bso0 -bsp0
          & "C:\Program Files\7-Zip\7z.exe" x mesa.tar -y -bso0 -bsp0
          if (-not (Test-Path "mesa-$env:MESA_VERSION\meson.build")) { Write-Error "extraction failed"; exit 1 }
          Write-Host "Patching"
          curl.exe -sfLo dxil-hash.patch "https://raw.githubusercontent.com/mmozeiko/build-mesa/$env:BUILD_MESA_COMMIT/patches/dxil-hash.patch"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cd "mesa-$env:MESA_VERSION"
          git apply --whitespace=nowarn ../dxil-hash.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply --whitespace=nowarn ../self/uwp-app/mesa/mesa-uwp-corewindow.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build vulkan_dzn.dll
        shell: cmd
        run: |
          rem Window, GDI and DirectComposition calls are for desktop windows: loaded only if used, so
          rem the driver still loads where those DLLs are missing.
          set LINK=/DELAYLOAD:user32.dll /DELAYLOAD:gdi32.dll /DELAYLOAD:dcomp.dll delayimp.lib version.lib ntdll.lib
          meson setup build mesa-%MESA_VERSION% --prefix="%CD%\dozen" --default-library=static --wrap-mode=default ^
            -Dbuildtype=release -Db_ndebug=true -Db_vscrt=mt "-Dc_args=-wd4189 -wd4319" ^
            -Dllvm=disabled -Dplatforms=windows -Dvideo-codecs= -Dgallium-drivers= ^
            -Dvulkan-drivers=microsoft-experimental -Dopengl=false -Degl=disabled -Dgles1=disabled -Dgles2=disabled || (
              type build\meson-logs\meson-log.txt | findstr /i "error" & exit /b 1 )
          ninja -C build install || exit /b 1

      - name: Collect the driver and dxil.dll
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $dll = Get-ChildItem -Recurse dozen -Filter vulkan_dzn.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "vulkan_dzn.dll was not built"; exit 1 }
          Copy-Item $dll.FullName out
          # dxil.dll: Microsoft's validator and signer from the DirectX Shader Compiler release (redistributable)
          gh release download --repo microsoft/DirectXShaderCompiler --pattern "dxc_*.zip" --dir dxc
          if ($LASTEXITCODE -eq 0) {
            Expand-Archive (Get-ChildItem dxc -Filter "dxc_*.zip" | Select-Object -First 1).FullName dxc\x
            Copy-Item dxc\x\bin\x64\dxil.dll out
            Get-ChildItem dxc\x -Filter "LICENSE*" | ForEach-Object { Copy-Item $_.FullName ("out\DXC-" + $_.Name) }
          } else { Write-Warning "no DXC release found: Mesa signs shaders itself (dxil-hash.patch)" }
          Copy-Item "mesa-$env:MESA_VERSION\docs\license.rst" out\LICENSE-mesa.txt -ErrorAction SilentlyContinue
          dumpbin /nologo /dependents out\vulkan_dzn.dll | Out-File -Encoding utf8 out\dozen-imports.txt
          Get-Content out\dozen-imports.txt
          Get-ChildItem out | Select-Object Name, Length

      - name: Upload the driver
        uses: actions/upload-artifact@v4
        with:
          name: mesa-dozen
          path: out/

  app:
    name: TLOU.Uwp package (MSVC)
    needs: [runtime, dozen]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed (the patch has LF)
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: self

      - name: Download the runtime
        uses: actions/download-artifact@v4
        with:
          name: gow3-runtime
          path: runtime

      - name: Download the Vulkan driver (Mesa Dozen) into the package
        uses: actions/download-artifact@v4
        with:
          name: mesa-dozen
          path: runtime

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Create the signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=TLOU-UWP" -KeyUsage DigitalSignature `
            -FriendlyName "TLOU UWP port" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = [guid]::NewGuid().ToString("N")
          "CERT_PW=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath "$PWD\tlou-uwp.pfx" `
            -Password (ConvertTo-SecureString -String $pw -AsPlainText -Force)
          Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath "$PWD\tlou-uwp-signing.cer"

      - name: Configure (CMake, WindowsStore)
        shell: pwsh
        run: |
          cmake -S self/uwp-app -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore "-DCMAKE_SYSTEM_VERSION=10.0" `
            "-DGOW3_UWP_INCLUDE=$PWD/self/gow3_pc/uwp" "-DGOW3_RUNTIME_DIR=$PWD/runtime" `
            "-DTLOU_CERT=$PWD/tlou-uwp.pfx"

      - name: Build and package
        shell: pwsh
        run: |
          msbuild build\TLOUUwp.vcxproj /m /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppxPackageOnBuild=true `
            "/p:AppxPackageDir=$PWD\AppPackages\" "/p:PackageCertificateKeyFile=$PWD\tlou-uwp.pfx" `
            "/p:PackageCertificatePassword=$env:CERT_PW" /p:PackageCertificateThumbprint= `
            /p:AppxPackageSigningEnabled=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse AppPackages | Select-Object FullName, Length

      - name: Collect the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path AppPackages -Recurse -Include *.msix,*.appx,*.msixbundle,*.appxbundle |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Copy-Item -Destination release
          Get-ChildItem -Path AppPackages -Recurse -Directory -Filter Dependencies | ForEach-Object {
            Get-ChildItem -Path $_.FullName -Recurse -Filter *.appx | Where-Object { $_.FullName -match 'x64' } |
              Copy-Item -Destination release
          }
          Copy-Item tlou-uwp-signing.cer release
          Copy-Item runtime\runtime-imports.txt release
          Copy-Item runtime\dozen-imports.txt release -ErrorAction SilentlyContinue
          Copy-Item self\uwp-app\README.md release\README-UWP.md
          Get-ChildItem release

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: tlou-uwp-package
          path: release/

  release:
    name: GitHub Release
    needs: [runtime, dozen, app]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tlou-uwp-package
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: stage-kit
          path: kit
      - name: Zip (the tag in the file names)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          (cd kit && zip -qr "../tlou-uwp-stage-kit-$TAG.zip" tlou-uwp-stage-kit)
          (cd release && zip -qr "../tlou-uwp-xbox-$TAG.zip" .)
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: TLOU Remastered UWP (Xbox Dev Mode) ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          body: |
            Experimental UWP build of the TLOU Remastered PC port (ravencaio/tlou-remastered-pc, GPL-2.0) for Xbox Developer Mode.
            What's new: Wi-Fi transfer (the launcher receives the game from your PC: no USB drive needed),
            a file check of game, update and stage on the console, and Setup-TLOU-Xbox.cmd in the kit: it finds
            your PS4 dump, prepares it and sends it to the Xbox in one go. Package version 0.2.0.0.

            tlou-uwp-xbox-*.zip: the app package, its dependency packages and the signing certificate.
            tlou-uwp-stage-kit-*.zip: run Stage-TLOU-Xbox.cmd on a PC with your own game dump, then copy
            the result to the console (README-UWP.md). Contains no game files.
            Rendering on Xbox needs a Vulkan driver in the package; see README-UWP.md (Known limits).
          files: |
            tlou-uwp-xbox-*.zip
            tlou-uwp-stage-kit-*.zip
          fail_on_unmatched_files: true
